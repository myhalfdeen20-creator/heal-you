                                <CharacterAvatar id={primary.id} colorHex={primary.hex} size="large" />
                                <div className="mt-6 mb-4 inline-flex items-center justify-center px-5 py-2 bg-white/60 border border-white rounded-full shadow-sm backdrop-blur-md">
                                    <span className="text-[11px] font-bold tracking-widest uppercase" style={{color: primary.hex}}>
                                        {primary.epithet}
                                    </span>
                                </div>
                                <h1 className="text-3xl sm:text-4xl lg:text-5xl font-serif text-slate-700 mb-4 px-2 leading-tight">
                                    {userName ? `Halo ${userName}, Karakteristikmu` : 'Karakteristikmu'}<br />Beresonansi dengan <span style={{color: primary.hex}} className="font-semibold">{primary.name}</span>
                                </h1>
                                <p className="text-slate-600 leading-relaxed text-base sm:text-lg max-w-3xl mx-auto font-medium z-10">
                                    {primary.shortSummary}
                                </p>
                            </div>

                            {/* Dinamika Relasional (Left column, 6 spans) */}
                            <div className="glass-panel col-span-1 md:col-span-6 rounded-[2rem] p-8 sm:p-10 slide-up stagger-2 flex flex-col">
                                <h3 className="text-xs font-bold text-slate-400 mb-5 tracking-widest uppercase">Dinamika Relasional & Keseharian</h3>
                                <p className="text-slate-700 text-base sm:text-lg leading-relaxed font-medium">
                                    {primary.roleDynamics}
                                </p>
                            </div>

                            {/* Blueprint Kognitif & Klinis (Right column, 6 spans) */}
                            <div className="glass-panel col-span-1 md:col-span-6 rounded-[2rem] p-8 sm:p-10 slide-up stagger-3 flex flex-col">
                                <h3 className="text-xs font-bold text-slate-400 mb-6 tracking-widest uppercase">Kekuatan Kognitif & Emosional</h3>
                                <ul className="space-y-4">
                                    {primary.wisdom.map((w, idx) => {
                                        const [term, desc] = w.split(': ');
                                        return (
                                            <li key={idx} className="flex flex-col gap-1.5 text-sm sm:text-base text-slate-700 font-medium leading-relaxed">
                                                <span className="inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-bold tracking-wider uppercase self-start border" style={{color: primary.hex, backgroundColor: `${primary.hex}10`, borderColor: `${primary.hex}30`}}>
                                                    {term}
                                                </span>
                                                <span className="text-slate-600">{desc}</span>
                                            </li>
                                        );
                                    })}
                                </ul>
                            </div>

                            {/* Secondary Character (Full width) */}
                            {secondary && (
                                <div className="glass-panel col-span-1 md:col-span-12 rounded-[2rem] p-6 sm:p-8 flex flex-col sm:flex-row items-center gap-6 slide-up stagger-4">
                                    <div className="shrink-0">
                                        <CharacterAvatar id={secondary.id} colorHex={secondary.hex} size="small" />
                                    </div>
                                    <div className="text-center sm:text-left">
                                        <p className="text-xs font-bold text-slate-400 tracking-widest uppercase mb-2">Sub-Rutinitas & Kapabilitas Paralel</p>
                                        <h3 className="text-xl font-serif text-slate-700 mb-2">{secondary.name}</h3>
                                        <p className="text-sm text-slate-600 leading-relaxed font-medium">
                                            Sistem arsitektur psikologismu juga didukung oleh modul <span className="font-semibold" style={{color: secondary.hex}}>{secondary.epithet}</span> layaknya karakteristik {secondary.name.split(' ')[0]}.
                                        </p>
                                    </div>
                                </div>
                            )}

                            {/* History/Analysis Toggle (Full width) */}
                            <div className="col-span-1 md:col-span-12 slide-up stagger-4">
                                <button 
                                    onClick={() => setIsHistoryExpanded(!isHistoryExpanded)}
                                    className="glass-panel w-full flex items-center justify-between p-6 rounded-[2rem] text-slate-700 font-semibold transition-all hover:bg-white/90"
                                    aria-expanded={isHistoryExpanded}
                                >
                                    <span>Analisis Historis & Psikologis Terapan</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`transform transition-transform duration-300 ${isHistoryExpanded ? 'rotate-180' : ''}`}>
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </button>
                                
                                {isHistoryExpanded && (
                                    <div className="glass-panel border-t-0 rounded-b-2xl p-6 sm:p-8 -mt-4 pt-8 text-base text-slate-700 leading-relaxed font-medium">
                                        {primary.history}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Actions */}
                        <div className="flex flex-col sm:flex-row flex-wrap gap-4 pt-6 slide-up stagger-4" data-html2canvas-ignore>
                            <button onClick={handleDownloadImage} disabled={isDownloading} className="btn-primary flex-1 py-4 px-4 rounded-3xl font-semibold flex items-center justify-center gap-2">
                                {isDownloading ? "Mengkompilasi..." : <><DownloadIcon /> Simpan Catatan</>}
                            </button>
                            <button onClick={onViewGallery} className="glass-panel flex-1 py-4 px-4 rounded-3xl font-semibold text-slate-700 hover:bg-white/80 transition-all border border-slate-200 flex items-center justify-center gap-2">
                                Lihat Galeri Lengkap
                            </button>
                            <button onClick={onReset} className="btn-secondary flex-1 py-4 px-4 rounded-3xl font-semibold">
                                Mulai Ulang
                            </button>
                        </div>
                        
                        <p className="text-center text-slate-400 text-xs font-medium pt-8 pb-4" data-html2canvas-ignore>
                            Analisis didasarkan pada sintesis historiografi dan psikologi klinis (CBT/IFS).
                        </p>
                    </div>
                </main>
            );
        };

        // --- 5. MAIN APP COMPONENT ---
        const App = () => {
            const [isInitializing, setIsInitializing] = useState(true);
            const [gameState, setGameState] = useState('welcome');
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [userName, setUserName] = useState('');
            const [isFading, setIsFading] = useState(false);

            useEffect(() => {
                let savedState = null;
                try {
                    savedState = localStorage.getItem('healyou_ummul_mukminin_state');
                } catch (e) {
                    console.error("Gagal mengakses localStorage", e);
                }
                if (savedState) {
                    try {
                        const parsed = JSON.parse(savedState);
                        if (parsed.questions && parsed.questions.length > 0) {
                            if (parsed.currentIndex >= parsed.questions.length) {
                                // Sudah selesai, kembali ke awal
                                try { localStorage.removeItem('healyou_ummul_mukminin_state'); } catch(e) {}
                            } else {
                                setQuestions(parsed.questions);
                                setCurrentIndex(parsed.currentIndex || 0);
                                setAnswers(parsed.answers || {});
                                if (parsed.userName) setUserName(parsed.userName);
                                
                                if (parsed.currentIndex > 0) {
                                    if (parsed.currentIndex % 11 === 0 && parsed.currentIndex !== 0) {
                                        setGameState('break');
                                    } else {
                                        setGameState('playing');
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        console.error("Gagal memuat penyimpanan", e);
                    }
                }
                setIsInitializing(false);
            }, []);

            const saveState = (newCurrentIndex, newAnswers, newQuestions, newUserName) => {
                const stateToSave = {
                    questions: newQuestions || questions,
                    currentIndex: newCurrentIndex,
                    answers: newAnswers,
                    userName: newUserName !== undefined ? newUserName : userName,
                    lastSaved: new Date().toISOString()
                };
                try {
                    localStorage.setItem('healyou_ummul_mukminin_state', JSON.stringify(stateToSave));
                } catch (e) {
                    console.error("Gagal menyimpan state", e);
                }
            };

            const transitionTo = (newState, delay = 400) => {
                setIsFading(true);
                setTimeout(() => {
                    setGameState(newState);
                    setIsFading(false);
                }, delay);
            };

            const startNew = () => {
                transitionTo('data_entry');
            };

            const submitUserData = (name) => {
                setUserName(name);
                const shuffled = shuffleArray(RAW_QUESTIONS);
                setQuestions(shuffled);
                setCurrentIndex(0);
                setAnswers({});
                saveState(0, {}, shuffled, name);
                transitionTo('playing');
            };

            const resume = () => {
                transitionTo('playing');
            };

            const handleAnswer = (val) => {
                const currentQ = questions[currentIndex];
                const newAnswers = { ...answers };
                
                if (!newAnswers[currentQ.a]) {
                    newAnswers[currentQ.a] = 0;
                }
                newAnswers[currentQ.a] += val;

                const nextIndex = currentIndex + 1;
                saveState(nextIndex, newAnswers, questions);

                setIsFading(true);
                setTimeout(() => {
                    setAnswers(newAnswers);
                    setCurrentIndex(nextIndex);
                    
                    if (nextIndex >= questions.length) {
                        setGameState('result');
                    } else if (nextIndex % 11 === 0 && nextIndex !== 0) {
                        setGameState('break');
                    }
                    setIsFading(false);
                }, 300);
            };

            const resetState = () => {
                if (window.confirm("Apakah kamu yakin ingin mereset sistem (menghapus cache data) dan memulai ulang dari awal?")) {
                    try { localStorage.removeItem('healyou_ummul_mukminin_state'); } catch (e) {}
                    setQuestions([]);
                    setCurrentIndex(0);
                    setAnswers({});
                    setUserName('');
                    transitionTo('welcome');
                }
            };

            const calculateResult = () => {
                const scores = Object.keys(answers).map(archId => ({
                    id: archId,
                    score: answers[archId]
                })).sort((a, b) => b.score - a.score);

                if (scores.length === 0) return { primary: ARCHETYPES[0], secondary: null };

                const primaryArch = ARCHETYPES.find(a => a.id === scores[0].id);
                const secondaryArch = scores.length > 1 && (scores[0].score - scores[1].score <= 3) 
                    ? ARCHETYPES.find(a => a.id === scores[1].id) 
                    : null;

                return { primary: primaryArch, secondary: secondaryArch };
            };

            return (
                <div className="bg-[#F7F5F0] text-slate-700 min-h-screen selection:bg-emerald-100 selection:text-emerald-900">
                    {isInitializing ? null : gameState === 'welcome' && (
                        <WelcomeScreen 
                            onStart={startNew} 
                            onResume={resume} 
                            onReset={resetState}
                            savedIndex={currentIndex} 
                            isFading={isFading}
                        />
                    )}

                    {gameState === 'data_entry' && (
                        <DataEntryScreen 
                            onSubmit={submitUserData}
                            isFading={isFading}
                        />
                    )}
                    
                    {gameState === 'playing' && questions.length > 0 && currentIndex < questions.length && (
                        <QuestionBoard 
                            question={questions[currentIndex]}
                            currentIndex={currentIndex}
                            totalQuestions={questions.length}
                            onAnswer={handleAnswer}
                            isFading={isFading}
                        />
                    )}
                    
                    {gameState === 'break' && (
                        <BreakScreen 
                            chunkIndex={Math.floor(currentIndex / 11)} 
                            onContinue={() => transitionTo('playing')}
                            isFading={isFading}
                        />
                    )}
                    
                    {gameState === 'result' && (
                        <ResultDashboard 
                            result={calculateResult()} 
                            userName={userName}
                            onReset={resetState}
                            onViewGallery={() => transitionTo('gallery')}
                            isFading={isFading}
                        />
                    )}

                    {gameState === 'gallery' && (
                        <GalleryScreen 
                            onBack={() => transitionTo(Object.keys(answers).length === RAW_QUESTIONS.length ? 'result' : 'welcome')}
                            isFading={isFading}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
