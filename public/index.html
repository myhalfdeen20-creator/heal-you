        // --- 4.5. AUDIO ENGINE (WEB AUDIO API - NO INSTRUMENTS) ---
        const AudioEngine = {
            ctx: null,
            master: null,
            activeNodes: [],
            birdInterval: null,
            currentType: 'wind',
            types: ['wind', 'ocean', 'rain', 'forest'],
            
            init: function() {
                if (this.ctx) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.master = this.ctx.createGain();
                this.master.gain.value = 0; // Start muted
                this.master.connect(this.ctx.destination);
            },
            
            clear: function() {
                if (this.birdInterval) clearInterval(this.birdInterval);
                this.activeNodes.forEach(node => {
                    try { if (node.stop) node.stop(); } catch(e) {}
                    try { node.disconnect(); } catch(e) {}
                });
                this.activeNodes = [];
            },

            createPinkNoise: function() {
                const bufferSize = this.ctx.sampleRate * 2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    data[i] *= 0.11;
                    b6 = white * 0.115926;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                noise.loop = true;
                return noise;
            },
            
            createBrownianNoise: function() {
                const bufferSize = this.ctx.sampleRate * 2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                let lastOut = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = data[i];
                    data[i] *= 3.5;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                noise.loop = true;
                return noise;
            },
            
                        chirp: function(baseFreq = 2000, pan = 0, isResponse = false) {
                if (!this.ctx || this.master.gain.value < 0.01) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                let panner;
                if (this.ctx.createStereoPanner) {
                    panner = this.ctx.createStereoPanner();
                    panner.pan.value = pan;
                } else {
                    panner = this.ctx.createGain(); // fallback
                }
                
                osc.type = 'sine';
                const now = this.ctx.currentTime;
                
                if (Math.random() > 0.5) {
                    // Swooping whistle
                    osc.frequency.setValueAtTime(baseFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq + 1000, now + 0.15);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq - 500, now + 0.3);
                    
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.15, now + 0.1);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else {
                    // Quick double chirp
                    osc.frequency.setValueAtTime(baseFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq + 800, now + 0.1);
                    osc.frequency.setValueAtTime(baseFreq - 200, now + 0.15);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq + 1000, now + 0.25);
                    
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.12, now + 0.05);
                    gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    gain.gain.linearRampToValueAtTime(0.12, now + 0.15);
                    gain.gain.linearRampToValueAtTime(0, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
                
                osc.connect(gain);
                gain.connect(panner);
                panner.connect(this.master);
                
                this.activeNodes.push(osc, gain, panner);
                
                if (!isResponse && Math.random() > 0.3) {
                    const responseDelay = 400 + Math.random() * 800; // 0.4s to 1.2s
                    const responsePan = -pan * (0.5 + Math.random() * 0.5); // Opposite side
                    const responseFreq = baseFreq > 2200 ? 1500 + Math.random()*400 : 2400 + Math.random()*500;
                    setTimeout(() => this.chirp(responseFreq, responsePan, true), responseDelay);
                    
                    if (Math.random() > 0.7) {
                        setTimeout(() => this.chirp(2000 + Math.random()*1000, pan * 0.8, true), responseDelay + 500 + Math.random()*500);
                    }
                }
            },
            
            buildSoundscape: function(type) {
                this.clear();
                
                if (type === 'wind') {
                    const noise = this.createPinkNoise();
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 350;
                    
                    const lfo = this.ctx.createOscillator();
                    lfo.type = 'sine';
                    lfo.frequency.value = 0.05;
                    const lfoGain = this.ctx.createGain();
                    lfoGain.gain.value = 250;
                    
                    const vol = this.ctx.createGain();
                    vol.gain.value = 0.7;
                    
                    lfo.connect(lfoGain);
                    lfoGain.connect(filter.frequency);
                    noise.connect(filter);
                    filter.connect(vol);
                    vol.connect(this.master);
                    
                    noise.start();
                    lfo.start();
                    this.activeNodes.push(noise, filter, lfo, lfoGain, vol);
                    
                                } else if (type === 'ocean') {
                    // Deep ocean rumble (constant background)
                    const deepNoise = this.createBrownianNoise();
                    const deepFilter = this.ctx.createBiquadFilter();
                    deepFilter.type = 'lowpass';
                    deepFilter.frequency.value = 100;
                    const deepVol = this.ctx.createGain();
                    deepVol.gain.value = 0.6;
                    deepNoise.connect(deepFilter);
                    deepFilter.connect(deepVol);
                    deepVol.connect(this.master);
                    deepNoise.start();
                    this.activeNodes.push(deepNoise, deepFilter, deepVol);
                    
                    // Crashing waves (periodic sweeping noise)
                    const waveNoise = this.createPinkNoise();
                    const waveFilter = this.ctx.createBiquadFilter();
                    waveFilter.type = 'bandpass';
                    waveFilter.frequency.value = 400;
                    waveFilter.Q.value = 0.8;
                    
                    // Wave timing LFO (slow, 0.08Hz = ~12.5 seconds per wave)
                    const waveLfo = this.ctx.createOscillator();
                    waveLfo.type = 'sine';
                    waveLfo.frequency.value = 0.08;
                    
                    // Sweep the frequency up during the wave crash
                    const freqGain = this.ctx.createGain();
                    freqGain.gain.value = 800; // Sweep from 400Hz up to 1200Hz
                    
                    // Control the volume of the wave
                    const waveVolLfo = this.ctx.createOscillator();
                    waveVolLfo.type = 'sine';
                    waveVolLfo.frequency.value = 0.08; // Match wave timing
                    
                    // Add a slight phase shift to volume relative to frequency
                    // so the loudest part is slightly before/during the highest frequency crash
                    // by using a delay node or just relying on the natural sine curve.
                    // To keep it simple, we use the same frequency.
                    const volGain = this.ctx.createGain();
                    volGain.gain.value = 1.0;
                    
                    const waveVol = this.ctx.createGain();
                    waveVol.gain.value = 0; // Starts quiet
                    
                    waveLfo.connect(freqGain);
                    freqGain.connect(waveFilter.frequency);
                    
                    waveVolLfo.connect(volGain);
                    volGain.connect(waveVol.gain);
                    
                    waveNoise.connect(waveFilter);
                    waveFilter.connect(waveVol);
                    waveVol.connect(this.master);
                    
                    waveNoise.start();
                    waveLfo.start();
                    
                    // Start the volume LFO slightly offset to simulate the crash
                    waveVolLfo.start(this.ctx.currentTime + 3); 
                    
                    this.activeNodes.push(waveNoise, waveFilter, waveLfo, freqGain, waveVolLfo, volGain, waveVol);
                    
                } else if (type === 'rain') {
                    const noise = this.createPinkNoise();
                    
                    const lpf = this.ctx.createBiquadFilter();
                    lpf.type = 'lowpass';
                    lpf.frequency.value = 1000;
                    
                    const hpf = this.ctx.createBiquadFilter();
                    hpf.type = 'highpass';
                    hpf.frequency.value = 300;
                    
                    const vol = this.ctx.createGain();
                    vol.gain.value = 1.2;
                    
                    noise.connect(lpf);
                    lpf.connect(hpf);
                    hpf.connect(vol);
                    vol.connect(this.master);
                    
                    noise.start();
                    this.activeNodes.push(noise, lpf, hpf, vol);
                    
                                } else if (type === 'forest') {
                    // Wind rustling through leaves
                    const leavesNoise = this.createPinkNoise();
                    const leavesFilter = this.ctx.createBiquadFilter();
                    leavesFilter.type = 'bandpass';
                    leavesFilter.frequency.value = 1200; // Higher freq for leaves
                    leavesFilter.Q.value = 0.5;
                    
                    const leavesLfo = this.ctx.createOscillator();
                    leavesLfo.type = 'sine';
                    leavesLfo.frequency.value = 0.04; // Slow gusts
                    const leavesLfoGain = this.ctx.createGain();
                    leavesLfoGain.gain.value = 800; // Sweep freq
                    
                    const leavesVolLfo = this.ctx.createOscillator();
                    leavesVolLfo.type = 'sine';
                    leavesVolLfo.frequency.value = 0.06;
                    const leavesVolLfoGain = this.ctx.createGain();
                    leavesVolLfoGain.gain.value = 0.25;
                    
                    const leavesVol = this.ctx.createGain();
                    leavesVol.gain.value = 0.08; // Sangat kecil, hanya terdengar sayup-sayup
                    
                    leavesLfo.connect(leavesLfoGain);
                    leavesLfoGain.connect(leavesFilter.frequency);
                    
                    leavesVolLfo.connect(leavesVolLfoGain);
                    leavesVolLfoGain.connect(leavesVol.gain);
                    
                    leavesNoise.connect(leavesFilter);
                    leavesFilter.connect(leavesVol);
                    leavesVol.connect(this.master);
                    
                    leavesNoise.start();
                    leavesLfo.start();
                    leavesVolLfo.start();
                    this.activeNodes.push(leavesNoise, leavesFilter, leavesLfo, leavesLfoGain, leavesVolLfo, leavesVolLfoGain, leavesVol);
                    
                    // Distant deep ambient rumble
                    const deepNoise = this.createPinkNoise();
                    const deepFilter = this.ctx.createBiquadFilter();
                    deepFilter.type = 'lowpass';
                    deepFilter.frequency.value = 200;
                    const deepVol = this.ctx.createGain();
                    deepVol.gain.value = 0.1; // Rumble di kejauhan yang sangat hening
                    deepNoise.connect(deepFilter);
                    deepFilter.connect(deepVol);
                    deepVol.connect(this.master);
                    deepNoise.start();
                    this.activeNodes.push(deepNoise, deepFilter, deepVol);
                    
                    // Bird conversation interval
                    this.birdInterval = setInterval(() => {
                        if (Math.random() > 0.4) {
                            const initPan = (Math.random() * 1.6) - 0.8; // -0.8 to 0.8
                            const initFreq = 1500 + Math.random() * 1500;
                            this.chirp(initFreq, initPan, false);
                        }
                    }, 4500);
                }
            },
            
            setType: function(type) {
                if (this.types.includes(type) && this.currentType !== type) {
                    this.currentType = type;
                    if (this.master && this.master.gain.value > 0.1) {
                        this.buildSoundscape(type);
                    }
                }
            },
            
            play: function() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.buildSoundscape(this.currentType);
                this.master.gain.setTargetAtTime(0.5, this.ctx.currentTime, 1.5);
            },
            
            stop: function() {
                if (!this.ctx) return;
                this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.5);
                setTimeout(() => this.clear(), 600);
            }
        };

        // --- 5. PARALLAX BACKGROUND COMPONENT ---
        const ParallaxBackground = () => {
            const bgRef1 = useRef(null);
            const bgRef2 = useRef(null);
            const bgRef3 = useRef(null);

            useEffect(() => {
                let ticking = false;

                const updateParallax = () => {
                    const scrollY = window.scrollY;
                    
                    if (bgRef1.current) {
                        bgRef1.current.style.transform = `translate3d(0, ${scrollY * 0.4}px, 0)`;
                    }
                    if (bgRef2.current) {
                        bgRef2.current.style.transform = `translate3d(0, ${scrollY * 0.25}px, 0)`;
                    }
                    if (bgRef3.current) {
                        bgRef3.current.style.transform = `translate3d(0, ${scrollY * 0.15}px, 0)`;
                    }
                    
                    ticking = false;
                };

                const handleScroll = () => {
                    if (!ticking) {
                        window.requestAnimationFrame(updateParallax);
                        ticking = true;
                    }
                };

                window.addEventListener('scroll', handleScroll, { passive: true });
                updateParallax();
                
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="fixed inset-0 z-0 pointer-events-none overflow-hidden" aria-hidden="true">
                    {/* Parallax Layer 1 (Deepest) */}
                    <div ref={bgRef1} className="absolute top-0 left-[-10%] w-[70vw] h-[70vw] max-w-[800px] max-h-[800px] rounded-full bg-indigo-200/20 blur-[120px] will-change-transform"></div>
                    
                    {/* Parallax Layer 2 (Mid) */}
                    <div ref={bgRef2} className="absolute top-[30%] right-[-10%] w-[60vw] h-[60vw] max-w-[700px] max-h-[700px] rounded-full bg-purple-100/30 blur-[100px] will-change-transform"></div>
                    
                    {/* Parallax Layer 3 (Closest) */}
                    <div ref={bgRef3} className="absolute top-[60%] left-[10%] w-[50vw] h-[50vw] max-w-[600px] max-h-[600px] rounded-full bg-blue-100/30 blur-[90px] will-change-transform"></div>
                    
                    {/* Grain Texture Overlay for Premium Feel */}
                    <div className="absolute inset-0 opacity-[0.03] mix-blend-multiply" style={{backgroundImage: 'url("data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.7%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E")'}}></div>
                </div>
            );
        };

        // --- 6. MAIN APP COMPONENT ---
        const App = () => {
            const [isAudioPlaying, setIsAudioPlaying] = useState(false);
            const [ambientType, setAmbientType] = useState('wind');
            const [showAudioMenu, setShowAudioMenu] = useState(false);
            const [showResetConfirm, setShowResetConfirm] = useState(false);

            const toggleAudio = () => {
                if (isAudioPlaying) {
                    if (!showAudioMenu) {
                        setShowAudioMenu(true);
                    } else {
                        AudioEngine.stop();
                        setIsAudioPlaying(false);
                        setShowAudioMenu(false);
                    }
                } else {
                    AudioEngine.play();
                    setIsAudioPlaying(true);
                    setShowAudioMenu(true);
                }
            };

            useEffect(() => {
                AudioEngine.setType(ambientType);
            }, [ambientType]);
            const [isInitializing, setIsInitializing] = useState(true);
            const [gameState, setGameState] = useState('welcome');
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [answerHistory, setAnswerHistory] = useState({});
            const [userName, setUserName] = useState('');
            const [isFading, setIsFading] = useState(false);

            useEffect(() => {
                let savedState = null;
                try {
                    savedState = localStorage.getItem('healyou_ummul_mukminin_state');
                } catch (e) {
                    console.error("Gagal mengakses localStorage", e);
                }
                if (savedState) {
                    try {
                        const parsed = JSON.parse(savedState);
                        if (parsed.questions && parsed.questions.length > 0) {
                            setQuestions(parsed.questions);
                            setCurrentIndex(parsed.currentIndex || 0);
                            setAnswers(parsed.answers || {});
                            if (parsed.answerHistory) setAnswerHistory(parsed.answerHistory);
                            if (parsed.userName) setUserName(parsed.userName);
                            
                            if (parsed.gameState) {
                                setGameState(parsed.gameState);
                            } else if (parsed.currentIndex >= parsed.questions.length) {
                                setGameState('result');
                            } else if (parsed.currentIndex > 0) {
                                if (parsed.currentIndex % 11 === 0 && parsed.currentIndex !== 0) {
                                    setGameState('break');
                                } else {
                                    setGameState('playing');
                                }
                            }
                        }
                    } catch (e) {
                        console.error("Gagal memuat penyimpanan", e);
                    }
                }
                setIsInitializing(false);
            }, []);

            const saveState = (newCurrentIndex, newAnswers, newQuestions, newUserName, newGameState, newAnswerHistory) => {
                const stateToSave = {
                    questions: newQuestions || questions,
                    currentIndex: newCurrentIndex,
                    answers: newAnswers,
                    answerHistory: newAnswerHistory !== undefined ? newAnswerHistory : answerHistory,
                    userName: newUserName !== undefined ? newUserName : userName,
                    gameState: newGameState || gameState,
                    lastSaved: new Date().toISOString()
                };
                try {
                    localStorage.setItem('healyou_ummul_mukminin_state', JSON.stringify(stateToSave));
                } catch (e) {
                    console.error("Gagal menyimpan state", e);
                }
            };

            const transitionTo = (newState, delay = 400) => {
                setIsFading(true);
                saveState(currentIndex, answers, questions, userName, newState, answerHistory);
                setTimeout(() => {
                    setGameState(newState);
                    setIsFading(false);
                    // Ensure the new screen always starts at the very top
                    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
                }, delay);
            };

            const startNew = () => {
                transitionTo('data_entry');
            };

            const submitUserData = (name) => {
                setUserName(name);
                const shuffled = shuffleArray(RAW_QUESTIONS);
                setQuestions(shuffled);
                setCurrentIndex(0);
                setAnswers({});
                setAnswerHistory({});
                saveState(0, {}, shuffled, name, 'playing', {});
                
                // Manual transition to prevent closure stale state overwriting localStorage
                setIsFading(true);
                setTimeout(() => {
                    setGameState('playing');
                    setIsFading(false);
                    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
                }, 400);
            };

            const resume = () => {
                transitionTo('playing');
            };

            const handleAnswer = (val) => {
                const currentQ = questions[currentIndex];
                const prevVal = answerHistory[currentIndex];
                const newAnswers = { ...answers };
                
                if (!newAnswers[currentQ.a]) {
                    newAnswers[currentQ.a] = 0;
                }
                // Subtract previous score if this question was already answered
                if (prevVal !== undefined) {
                    newAnswers[currentQ.a] -= prevVal;
                }
                newAnswers[currentQ.a] += val;

                const newAnswerHistory = { ...answerHistory, [currentIndex]: val };

                const nextIndex = currentIndex + 1;
                let nextState = 'playing';
                
                if (nextIndex >= questions.length) {
                    nextState = 'analyzing';
                } else if (nextIndex % 11 === 0 && nextIndex !== 0) {
                    nextState = 'break';
                }

                setAnswerHistory(newAnswerHistory);
                saveState(nextIndex, newAnswers, questions, userName, nextState, newAnswerHistory);

                setIsFading(true);
                setTimeout(() => {
                    setAnswers(newAnswers);
                    setCurrentIndex(nextIndex);
                    setGameState(nextState);
                    setIsFading(false);
                    // Scroll to top if transitioning to break or analyzing
                    if (nextState !== 'playing') {
                        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
                    }
                }, 400);
            };

            const handlePrevious = () => {
                if (currentIndex <= 0) return;
                const prevIndex = currentIndex - 1;
                
                saveState(prevIndex, answers, questions, userName, 'playing', answerHistory);

                setIsFading(true);
                setTimeout(() => {
                    setCurrentIndex(prevIndex);
                    setGameState('playing');
                    setIsFading(false);
                }, 250);
            };

            const handleJumpToQuestion = (targetIndex) => {
                if (targetIndex < 0 || targetIndex >= questions.length) return;
                saveState(targetIndex, answers, questions, userName, 'playing', answerHistory);

                setIsFading(true);
                setTimeout(() => {
                    setCurrentIndex(targetIndex);
                    setGameState('playing');
                    setIsFading(false);
                    window.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
                }, 200);
            };

            const resetState = () => {
                try { localStorage.removeItem('healyou_ummul_mukminin_state'); } catch (e) {}
                setQuestions([]);
                setCurrentIndex(0);
                setAnswers({});
                setAnswerHistory({});
                setUserName('');
                setShowResetConfirm(false);
                setGameState('welcome'); 
                window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
            };

            const calculateResult = () => {
                const maxScore = 25; // 5 questions * 5 max points
                const scores = ARCHETYPES.map(arch => {
                    const score = answers[arch.id] || 0;
                    return {
                        id: arch.id,
                        name: arch.name.split(' ')[0],
                        fullName: arch.name,
                        hex: arch.hex,
                        score: score,
                        matchPercentage: Math.round((score / maxScore) * 100)
                    };
                }).sort((a, b) => b.score - a.score);

                if (scores.length === 0) return { primary: ARCHETYPES[0], secondary: null, scores: [] };

                const primaryArch = { ...ARCHETYPES.find(a => a.id === scores[0].id), matchPercentage: scores[0].matchPercentage };
                const secondaryArch = scores.length > 1 && (scores[0].score - scores[1].score <= 3) 
                    ? { ...ARCHETYPES.find(a => a.id === scores[1].id), matchPercentage: scores[1].matchPercentage }
                    : null;

                return { primary: primaryArch, secondary: secondaryArch, scores };
            };

            return (
                <div className="bg-[#F6F7FA] text-slate-700 min-h-screen selection:bg-indigo-100 selection:text-indigo-900 relative">
                    <ParallaxBackground />
                    
                    <div className="relative z-10 flex flex-col min-h-screen">
                        {/* Floating Audio Controls */}
                        <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">
                            {isAudioPlaying && showAudioMenu && (
                                <div className="bg-white/90 backdrop-blur-md shadow-xl border border-slate-200 rounded-2xl p-2 flex flex-col gap-1 slide-up">
                                    <div className="px-2 pt-1 pb-2 mb-1 flex justify-between items-center border-b border-slate-100">
                                        <span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase ml-1">Suara Ambien</span>
                                        <button onClick={() => setShowAudioMenu(false)} className="text-slate-400 hover:text-slate-600 px-2 rounded-full">✕</button>
                                    </div>
                                    {[
                                        { id: 'wind', name: 'Angin', icon: '🍃' },
                                        { id: 'ocean', name: 'Ombak', icon: '🌊' },
                                        { id: 'rain', name: 'Gerimis', icon: '🌧️' },
                                        { id: 'forest', name: 'Hutan', icon: '🌲' },
                                    ].map(t => (
                                        <button
                                            key={t.id}
                                            onClick={() => { setAmbientType(t.id); setShowAudioMenu(false); }}
                                            className={`px-3 py-2 text-xs font-bold tracking-wider rounded-xl transition-colors text-left flex items-center gap-2 ${ambientType === t.id ? 'bg-[#6B688D] text-white' : 'text-slate-500 hover:bg-slate-100'}`}
                                        >
                                            <span>{t.icon}</span> {t.name}
                                        </button>
                                    ))}
                                </div>
                            )}
                            <button 
                                onClick={toggleAudio}
                                className="p-4 rounded-full bg-white/90 backdrop-blur-md shadow-xl border border-slate-200 text-slate-500 hover:text-[#6B688D] hover:bg-white transition-all duration-300"
                                aria-label={isAudioPlaying ? "Matikan Suara Ambien" : "Nyalakan Suara Ambien"}
                                title={isAudioPlaying ? "Matikan Suara Ambien" : "Nyalakan Suara Ambien"}
                            >
                                {isAudioPlaying ? <SoundOnIcon /> : <SoundOffIcon />}
                            </button>
                        </div>

                        {isInitializing ? null : gameState === 'welcome' && (
                            <WelcomeScreen 
                                onStart={startNew} 
                                onResume={resume} 
                                onReset={() => setShowResetConfirm(true)}
                                savedIndex={currentIndex} 
                                isFading={isFading}
                            />
                        )}

                        {gameState === 'data_entry' && (
                            <DataEntryScreen 
                                onSubmit={submitUserData}
                                onBack={() => transitionTo('welcome')}
                                isFading={isFading}
                            />
                        )}
                        
                        {gameState === 'playing' && questions.length > 0 && currentIndex < questions.length && (
                            <QuestionBoard 
                                question={questions[currentIndex]}
                                currentIndex={currentIndex}
                                totalQuestions={questions.length}
                                onAnswer={handleAnswer}
                                onPrevious={handlePrevious}
                                onBackToWelcome={() => transitionTo('welcome')}
                                currentAnswer={answerHistory[currentIndex]}
                                answerHistory={answerHistory}
                                onJumpToQuestion={handleJumpToQuestion}
                                isFading={isFading}
                            />
                        )}
                        
                        {gameState === 'break' && (
                            <BreakScreen 
                                chunkIndex={Math.floor(currentIndex / 11)} 
                                onContinue={() => transitionTo('playing')}
                                onBack={handlePrevious}
                                isFading={isFading}
                            />
                        )}
                        
                        {gameState === 'analyzing' && (
                            <AnalyzingScreen 
                                onComplete={() => transitionTo('result')}
                                isFading={isFading}
                            />
                        )}

                        {gameState === 'result' && (
                            <ResultDashboard 
                                result={calculateResult()} 
                                userName={userName}
                                onReset={() => setShowResetConfirm(true)}
                                onViewGallery={() => transitionTo('gallery')}
                                isFading={isFading}
                            />
                        )}

                        {gameState === 'gallery' && (
                            <GalleryScreen 
                                onBack={() => transitionTo((currentIndex > 0 && currentIndex >= RAW_QUESTIONS.length) ? 'result' : 'welcome')}
                                isFading={isFading}
                            />
                        )}

                        {/* Custom Reset Confirm Modal */}
                        {showResetConfirm && ReactDOM.createPortal(
                            <div className="fixed inset-0 z-[99999] flex items-center justify-center p-4 sm:p-6 fade-in" onClick={() => setShowResetConfirm(false)}>
                                <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" aria-hidden="true"></div>
                                <div className="glass-panel max-w-sm w-full rounded-[2rem] p-8 sm:p-10 relative z-10 slide-up shadow-2xl text-center" onClick={e => e.stopPropagation()}>
                                    <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                                    </div>
                                    <h4 className="text-xl font-serif text-slate-800 mb-4">Mulai Ulang?</h4>
                                    <p className="text-sm text-slate-600 font-medium mb-8">
                                        Apakah kamu yakin ingin mereset sistem dan memulai ulang dari awal? Semua riwayat jawabanmu akan dihapus.
                                    </p>
                                    <div className="flex flex-col sm:flex-row gap-3">
                                        <button onClick={() => setShowResetConfirm(false)} className="flex-1 py-3 px-4 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">
                                            Batal
                                        </button>
                                        <button onClick={resetState} className="flex-1 py-3 px-4 rounded-xl font-bold text-white bg-red-500 hover:bg-red-600 transition-colors shadow-md shadow-red-500/20">
                                            Ya, Mulai Ulang
                                        </button>
                                    </div>
                                </div>
                            </div>,
                            document.body
                        )}
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
