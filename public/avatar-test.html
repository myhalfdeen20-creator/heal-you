<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #f0f0f0; display: flex; gap: 20px; padding: 50px; }
  .avatar { width: 200px; height: 200px; border-radius: 50%; background: #e0e0e0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<div class="avatar">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
    <!-- Background Body / Base Khimar -->
    <path d="M 10 100 C 15 45 35 25 50 25 C 65 25 85 45 90 100 Z" fill="#0d6b52" />
    
    <!-- Face -->
    <ellipse cx="50" cy="45" rx="13" ry="18" fill="#F4D3B6" />
    
    <!-- Inner Hijab Cap -->
    <path d="M 37 40 C 37 32 63 32 63 40 C 63 36 37 36 37 40 Z" fill="#084d3a" />
    
    <!-- Hijab framing (cheeks and chin) -->
    <path d="M 36 45 C 36 28 64 28 64 45 C 64 57 58 64 50 67 C 42 64 36 57 36 45 Z" fill="none" stroke="#0d6b52" stroke-width="3" />
    
    <!-- Flowing Drape -->
    <path d="M 34.5 55 C 20 70 30 100 50 100 C 70 100 80 70 65.5 55 C 55 75 45 75 34.5 55 Z" fill="#118a6a" />
    <path d="M 50 67 C 50 85 65 95 85 100 L 90 100 C 85 60 70 50 64 45 C 64 57 58 64 50 67 Z" fill="#084d3a" opacity="0.4" />
  </svg>
</div>

<div class="avatar">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
    <!-- Khimar style 2 -->
    <path d="M 5 100 C 10 50 30 15 50 15 C 70 15 90 50 95 100 Z" fill="#c96a3f" />
    <ellipse cx="50" cy="42" rx="12" ry="16" fill="#E8C3A8" />
    <path d="M 38 42 C 38 30 62 30 62 42 C 62 52 56 59 50 61 C 44 59 38 52 38 42 Z" fill="none" stroke="#9e502e" stroke-width="3" />
    <!-- Single wrap -->
    <path d="M 38 53 C 25 70 40 100 50 100 C 60 100 90 85 95 100 L 5 100 Z" fill="#e07746" opacity="0.9" />
  </svg>
</div>

</body>
</html>
